[client]
# "type": solo el tipo de excepción en el navegador; el detalle completo queda en los logs del servidor
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[server]
headless = true
# enableCORS y enableXsrfProtection se dejan en sus valores por defecto (activados)

[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1e293b"
font = "sans serif"
